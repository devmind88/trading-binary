<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="86" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Candlestick graphic -->
  <!-- Candle 1: Red -->
  <line x1="140" y1="160" x2="140" y2="360" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  <rect x="120" y="200" width="40" height="110" rx="6" fill="#f43f5e"/>
  
  <!-- Candle 2: Green -->
  <line x1="230" y1="120" x2="230" y2="400" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <rect x="210" y="160" width="40" height="170" rx="6" fill="#10b981"/>

  <!-- Candle 3: Indigo Bullish Break -->
  <line x1="320" y1="100" x2="320" y2="340" stroke="#6366f1" stroke-width="6" stroke-linecap="round"/>
  <rect x="300" y="130" width="40" height="130" rx="6" fill="#6366f1"/>

  <!-- Shield overlay in corner -->
  <path d="M 370,300 L 440,300 L 440,370 C 440,410 405,440 370,450 C 335,440 300,410 300,370 L 300,300 Z" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8"/>
  <path d="M 345,370 L 365,390 L 400,345" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
